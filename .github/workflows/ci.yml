name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install native media and OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix mediainfo tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu libgomp1

      - name: Cache verification models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/managerr-models-cache
          key: verification-models-v1

      - name: Build solution
        run: dotnet build Managerr.sln -c Release -warnaserror -p:AllowMissingPrunePackageData=true

      - name: Run full test suite
        env:
          MANAGERR_MODELS_DIR: ${{ runner.temp }}/managerr-models-cache
        run: dotnet test Managerr.sln -c Release --no-build --maxcpucount:1 -p:AllowMissingPrunePackageData=true --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          retention-days: 14

  frontend:
    name: Lint, Unit Test & Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Managerr.Frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix src/Managerr.Frontend ci

      - name: Run ESLint
        run: npm --prefix src/Managerr.Frontend run lint

      - name: Run Vitest suite
        run: npm --prefix src/Managerr.Frontend test -- --run

      - name: Build production bundle
        run: npm --prefix src/Managerr.Frontend run build

  frontend-smoke:
    name: Playwright E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Managerr.Frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install frontend dependencies and Chromium
        run: |
          npm --prefix src/Managerr.Frontend ci
          npx --prefix src/Managerr.Frontend playwright install --with-deps chromium

      - name: Build frontend and run Playwright smoke tests
        run: |
          npm --prefix src/Managerr.Frontend run build
          npm --prefix src/Managerr.Frontend run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/Managerr.Frontend/playwright-report/
          retention-days: 14

  docker-build:
    name: Docker Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
