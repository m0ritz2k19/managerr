name: Arr Compatibility Drift Check

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arr-compat-drift:
    name: Check Sonarr/Radarr/Seerr API Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check upstream contracts and run ArrCompat tests
        run: |
          set -u
          up=$(mktemp -d)
          for r in Sonarr Radarr; do
            git clone -q --depth 1 --filter=blob:none --sparse "https://github.com/$r/$r.git" "$up/$r"
            git -C "$up/$r" sparse-checkout set "src/$r.Api.V3"
          done
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/seerr-team/seerr.git "$up/seerr"
          git -C "$up/seerr" sparse-checkout set server/api/servarr
          status=0
          python3 scripts/update-arr-compat-contract.py seerr --seerr "$up/seerr" --check || status=1
          python3 scripts/update-arr-compat-contract.py seerr --seerr "$up/seerr"
          python3 scripts/update-arr-compat-contract.py specs --upstream "$up"
          git diff --stat
          git diff > drift.patch
          dotnet test tests/Managerr.Phase6.Tests/Managerr.Phase6.Tests.csproj -c Release -p:AllowMissingPrunePackageData=true --filter "FullyQualifiedName~ArrCompat" || status=1
          exit $status

      - name: Upload contract drift patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arr-compat-drift-patch
          path: drift.patch
          retention-days: 28
